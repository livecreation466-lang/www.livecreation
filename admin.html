<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>LIVE CREATION — Admin ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--cy:#00F0FF;--mg:#FF00A8;--yl:#FFE500;--bg:#040406;--bg2:#0a0a0e;--bg3:#101016;--line:rgba(255,255,255,.08);--txt:#eaeaee;--txt2:#8a8a94;--ok:#22c55e;--er:#ef4444;--wr:#f59e0b}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Space Grotesk',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--txt);background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;outline:none;transition:.2s}
input:focus,select:focus,textarea:focus{border-color:var(--cy);background:rgba(0,240,255,.04)}
label{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;color:var(--txt2);margin-bottom:6px;text-transform:uppercase;font-weight:500}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:var(--bg)}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--cy),var(--mg));border-radius:4px}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
#login::before{content:'';position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(circle,rgba(0,240,255,.12),transparent 60%);pointer-events:none}
.login-box{background:var(--bg2);border:1px solid var(--line);border-radius:24px;padding:48px 36px;max-width:420px;width:100%;text-align:center;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:up .5s}
@keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.login-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cy),var(--mg),var(--yl));background-size:300% 100%;animation:shift 3s linear infinite}
@keyframes shift{to{background-position:300% 50%}}
.login-icon{width:72px;height:72px;border-radius:20px;background:linear-gradient(135deg,rgba(0,240,255,.15),rgba(255,0,168,.15));border:1px solid rgba(0,240,255,.3);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 20px}
.login-box h1{font-size:26px;margin-bottom:8px;letter-spacing:-.4px;font-weight:700}
.login-box p{color:var(--txt2);font-size:13px;margin-bottom:24px}
.pin-in{text-align:center;font-size:22px;letter-spacing:10px;padding:16px;margin-bottom:14px;font-weight:700;font-family:'JetBrains Mono',monospace}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,var(--cy),var(--mg));color:#fff;font-weight:600;font-size:14px;border-radius:12px;transition:.2s;box-shadow:0 8px 24px rgba(0,240,255,.25)}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 10px 32px rgba(255,0,168,.4)}
.login-back{display:inline-block;margin-top:18px;font-size:12px;color:var(--txt2)}
#app{display:none;min-height:100vh}
#app.show{display:flex}
@media(max-width:900px){#app.show{flex-direction:column}}
aside{width:220px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;flex-shrink:0;overflow-y:auto}
@media(max-width:900px){aside{width:100%;height:auto;position:static;border-right:none;border-bottom:1px solid var(--line);max-height:none}}
.side-brand{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.sbm{width:32px;height:32px;border-radius:8px;background:var(--bg3);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;flex-shrink:0}
.sbm::before{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,var(--cy),var(--mg));animation:spin 4s linear infinite}
.sbm::after{content:'';position:absolute;width:8px;height:8px;background:var(--bg3);border-radius:50%}
@keyframes spin{to{transform:rotate(360deg)}}
.sbt{font-weight:700;font-size:13px;letter-spacing:-.2px;line-height:1.1}
.sbsub{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.5px;color:var(--txt2);margin-top:3px}
.side-nav{padding:8px;flex:1;display:flex;flex-direction:column;gap:2px}
@media(max-width:900px){.side-nav{flex-direction:row;overflow-x:auto;padding:6px;gap:3px}}
.side-nav button{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--txt2);font-size:12.5px;font-weight:500;transition:.2s;text-align:left;white-space:nowrap;flex-shrink:0;font-family:inherit;background:none;border:none;cursor:pointer}
.side-nav button:hover{background:rgba(255,255,255,.05);color:var(--txt)}
.side-nav button.active{background:linear-gradient(135deg,rgba(0,240,255,.15),rgba(255,0,168,.15));color:var(--cy);border:1px solid rgba(0,240,255,.3)}
.side-nav .ic{font-size:15px}
.side-foot{padding:10px;border-top:1px solid var(--line);font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1px;color:var(--txt2)}
@media(max-width:900px){.side-foot{display:none}}
.sync-status{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.sync-status .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.sync-status.offline .dot{background:var(--wr);box-shadow:0 0 6px var(--wr)}
main{flex:1;padding:20px;overflow-y:auto;max-width:100%}
@media(max-width:520px){main{padding:14px}}
.mh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.mh h2{font-size:20px;font-weight:700;letter-spacing:-.4px}
.mh .sub{font-size:11px;color:var(--txt2);margin-top:3px;font-family:'JetBrains Mono',monospace}
.btn{padding:9px 16px;border-radius:10px;font-size:12.5px;font-weight:600;transition:.25s;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-family:inherit;cursor:pointer;border:none}
.btn-p{background:linear-gradient(135deg,var(--cy),var(--mg));color:#fff;box-shadow:0 4px 20px rgba(0,240,255,.25)}
.btn-p:hover{transform:translateY(-1px);box-shadow:0 6px 28px rgba(255,0,168,.35)}
.btn-g{background:rgba(255,255,255,.04);color:var(--txt);border:1px solid var(--line)}
.btn-g:hover{background:rgba(255,255,255,.08);border-color:rgba(0,240,255,.3)}
.btn-d{background:rgba(239,68,68,.1);color:var(--er);border:1px solid rgba(239,68,68,.3)}
.btn-d:hover{background:rgba(239,68,68,.2)}
.btn-sm{padding:6px 11px;font-size:11px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(4,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.g4,.g3,.g2{grid-template-columns:1fr}}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:16px;position:relative;overflow:hidden}
.stat::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cy),var(--mg))}
.stat.c2::before{background:var(--mg)}
.stat.c3::before{background:var(--yl)}
.stat.c4::before{background:var(--ok)}
.stat .lbl{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1.5px;color:var(--txt2);text-transform:uppercase;margin-bottom:8px}
.stat .val{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1}
.stat.c1 .val{color:var(--cy)}
.stat.c2 .val{color:var(--mg)}
.stat.c3 .val{color:var(--yl)}
.stat.c4 .val{color:var(--ok)}
.stat .sub{font-size:10.5px;color:var(--txt2);margin-top:6px;font-family:'JetBrains Mono',monospace}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}
.panel h3{font-size:13.5px;font-weight:600;margin-bottom:14px;letter-spacing:-.2px;display:flex;align-items:center;gap:6px}
.chart{display:flex;align-items:flex-end;gap:5px;height:140px;padding:20px 0 0;overflow-x:auto}
.bar-wrap{flex:1;min-width:28px;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bar{width:100%;background:linear-gradient(180deg,var(--cy),var(--mg));border-radius:4px 4px 0 0;min-height:2px;position:relative;transition:.4s}
.bar span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--cy);font-weight:700;white-space:nowrap}
.bar-lbl{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--txt2);white-space:nowrap}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:12px;transition:.2s;cursor:pointer;flex-wrap:wrap}
.row:hover{border-color:rgba(0,240,255,.3);background:rgba(0,240,255,.02)}
.row .main{flex:1;min-width:180px}
.row .ttl{font-weight:600;font-size:13.5px;margin-bottom:2px}
.row .meta{font-size:11px;color:var(--txt2);font-family:'JetBrains Mono',monospace;display:flex;gap:10px;flex-wrap:wrap}
.row .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1px;padding:3px 9px;border-radius:100px;font-weight:600;text-transform:uppercase;white-space:nowrap}
.b-new{background:rgba(0,240,255,.1);color:var(--cy);border:1px solid rgba(0,240,255,.3)}
.b-processing{background:rgba(255,229,0,.1);color:var(--yl);border:1px solid rgba(255,229,0,.3)}
.b-ready{background:rgba(34,197,94,.1);color:var(--ok);border:1px solid rgba(34,197,94,.3)}
.b-delivered{background:rgba(255,255,255,.05);color:var(--txt2);border:1px solid var(--line)}
.b-cancelled{background:rgba(239,68,68,.1);color:var(--er);border:1px solid rgba(239,68,68,.3)}
.b-paid{background:rgba(34,197,94,.1);color:var(--ok);border:1px solid rgba(34,197,94,.3)}
.b-unpaid{background:rgba(239,68,68,.1);color:var(--er);border:1px solid rgba(239,68,68,.3)}
.b-partial{background:rgba(245,158,11,.1);color:var(--wr);border:1px solid rgba(245,158,11,.3)}
.b-pending{background:rgba(255,229,0,.1);color:var(--yl);border:1px solid rgba(255,229,0,.3)}
.b-confirmed{background:rgba(34,197,94,.1);color:var(--ok);border:1px solid rgba(34,197,94,.3)}
.tabs-mini{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.tab-mini{padding:6px 12px;border:1px solid var(--line);border-radius:100px;background:transparent;color:var(--txt2);font-size:11.5px;font-weight:500;transition:.2s;white-space:nowrap;font-family:inherit;cursor:pointer}
.tab-mini:hover{border-color:rgba(0,240,255,.3);color:var(--txt)}
.tab-mini.active{background:linear-gradient(135deg,var(--cy),var(--mg));color:#fff;border-color:transparent}
.empty{text-align:center;padding:40px 20px;color:var(--txt2);font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:1px}
.empty .ic{font-size:36px;opacity:.3;margin-bottom:10px}
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);display:none;padding:20px;overflow-y:auto}
.modal.open{display:flex;align-items:flex-start;justify-content:center}
.modal-in{background:var(--bg2);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;margin:auto;position:relative;overflow:hidden;animation:up .3s}
.modal-in::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--cy),var(--mg),var(--yl))}
.modal-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-h h3{font-size:14px;font-weight:600}
.modal-x{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--txt);transition:.2s}
.modal-x:hover{background:var(--er);border-color:var(--er);color:#fff}
.modal-b{padding:18px;max-height:70vh;overflow-y:auto}
.modal-f{padding:10px 18px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid .full{grid-column:1/-1}
@media(max-width:520px){.form-grid{grid-template-columns:1fr}}
#toast{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--cy);border-radius:10px;padding:11px 16px;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:ts .3s;max-width:280px;transition:.3s}
.toast.ok{border-left-color:var(--ok)}
.toast.err{border-left-color:var(--er)}
@keyframes ts{from{transform:translateX(100%);opacity:0}to{transform:none;opacity:1}}
.sync-box{background:linear-gradient(160deg,rgba(0,240,255,.06),rgba(255,0,168,.04));border:1px solid rgba(0,240,255,.3);border-radius:12px;padding:16px}
.sync-box .code{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--cy);background:var(--bg3);padding:10px 12px;border-radius:8px;border:1px solid var(--line);word-break:break-all;display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
.sync-box .url{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--txt2);background:var(--bg3);padding:8px 10px;border-radius:6px;border:1px solid var(--line);word-break:break-all;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:6px}
.help{font-size:11.5px;color:var(--txt2);line-height:1.6;padding:10px;background:rgba(255,229,0,.05);border:1px solid rgba(255,229,0,.2);border-radius:8px;margin-top:10px}
.help b{color:var(--yl)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1.2px;color:var(--txt2);text-transform:uppercase;border-bottom:1px solid var(--line);font-weight:500}
td{padding:10px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.02)}
.img-prev{width:100%;height:120px;border-radius:8px;background-size:cover;background-position:center;background-color:var(--bg3);border:1px dashed var(--line);display:flex;align-items:center;justify-content:center;color:var(--txt2);font-family:'JetBrains Mono',monospace;font-size:10px;cursor:pointer}
.imp-preview{background:var(--bg3);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;justify-content:center;align-items:center;min-height:200px}
.imp-sheet{background:#fff;position:relative;display:grid;gap:2px;padding:2px;border-radius:3px}
.imp-piece{background:linear-gradient(135deg,var(--cy),var(--mg));border-radius:2px}
.calc-box{background:linear-gradient(160deg,rgba(0,240,255,.06),rgba(255,0,168,.04));border:1px solid var(--line);border-radius:12px;padding:18px;position:sticky;top:80px}
.calc-box .tot{font-size:32px;font-weight:800;letter-spacing:-.04em;color:var(--cy);line-height:1}
.calc-box .brk{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-family:'JetBrains Mono',monospace}
.calc-box .brk>div{display:flex;justify-content:space-between;color:var(--txt2)}
.calc-box .brk b{color:var(--txt);font-weight:500}
.split{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.mcard{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:12px;position:relative}
.mcard.running{border-color:rgba(245,158,11,.4);background:linear-gradient(160deg,rgba(245,158,11,.05),transparent)}
.mcard.idle{border-color:rgba(34,197,94,.25)}
.mcard .nm{font-weight:600;font-size:12.5px;margin-bottom:4px}
.mcard .st{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;font-weight:600}
.mcard.running .st{color:var(--wr)}
.mcard.idle .st{color:var(--ok)}
.mcard .cur{font-size:10.5px;color:var(--txt2);margin-top:6px;font-family:'JetBrains Mono',monospace}
.top-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;gap:10px}
.top-row:last-child{border-bottom:none}
.top-row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div id="login">
  <div class="login-box">
    <div class="login-icon">🔐</div>
    <h1>Admin Panel</h1>
    <p>Enter your PIN to continue</p>
    <input type="password" class="pin-in" id="pinIn" placeholder="••••" maxlength="8" inputmode="numeric" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Unlock Dashboard</button>
    <a class="login-back" href="shop.html">← Back to shop</a>
  </div>
</div>
<div id="app">
  <aside>
    <div class="side-brand"><div class="sbm"></div><div><div class="sbt" id="shopNameSide">LIVE CREATION</div><div class="sbsub">ADMIN ERP</div></div></div>
    <div class="side-nav" id="sideNav">
      <button data-tab="dashboard" class="active"><span class="ic">📊</span>Dashboard</button>
      <button data-tab="orders"><span class="ic">🛒</span>Orders</button>
      <button data-tab="jobs"><span class="ic">🔧</span>Jobs</button>
      <button data-tab="costing"><span class="ic">💰</span>Costing</button>
      <button data-tab="imposition"><span class="ic">📐</span>Imposition</button>
      <button data-tab="customers"><span class="ic">👥</span>Customers</button>
      <button data-tab="invoices"><span class="ic">🧾</span>Invoices</button>
      <button data-tab="appointments"><span class="ic">📅</span>Appointments</button>
      <button data-tab="products"><span class="ic">📦</span>Products</button>
      <button data-tab="analytics"><span class="ic">📈</span>Analytics</button>
      <button data-tab="sync"><span class="ic">☁️</span>Sync</button>
      <button data-tab="settings"><span class="ic">⚙️</span>Settings</button>
    </div>
    <div class="side-foot">
      <div class="sync-status" id="sideSync"><span class="dot"></span><span id="sideSyncTxt">LOCAL</span></div>
      <div>v2.1 · LC ERP</div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"></div>
<div id="toast"></div>

<script>
/* ===== CONFIG ===== */
const SYNC = new URLSearchParams(location.search).get('sync') || localStorage.getItem('lc_sync') || '';
if(SYNC) localStorage.setItem('lc_sync', SYNC);
const CLOUD = 'https://kvdb.io';
const LS_KEY = 'lc_shop_v2';

/* ===== CATALOG ===== */
const CATALOG = {

function mergeDefaults(d){
  const def = defaultDB();
  Object.keys(def).forEach(k=>{ if(d[k]===undefined) d[k]=def[k]; });
  if(!d.analytics.daily) d.analytics.daily={};
  if(!d.analytics.productViews) d.analytics.productViews={};
  if(!d.analytics.productWA) d.analytics.productWA={};
  return d;
}

function localLoad(){try{const raw=localStorage.getItem(LS_KEY);if(raw)DB=mergeDefaults(JSON.parse(raw));}catch(e){}}

async function cloudLoad(){
  if(!SYNC) return false;
  try{const r=await fetch(`${CLOUD}/${SYNC}/shop_data`,{cache:'no-store'});if(!r.ok)return false;const d=await r.json();if(d&&d.shop){DB=mergeDefaults(d);storageMode='cloud';return true;}}catch(e){}
  return false;
}
async function cloudSave(){
  if(!SYNC) return false;
  try{const r=await fetch(`${CLOUD}/${SYNC}/shop_data`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(DB)});return r.ok;}catch(e){return false;}
}

function topList(key,color){
  const arr=Object.entries(DB.analytics[key]||{}).sort((x,y)=>y[1]-x[1]).slice(0,5);
  if(!arr.length) return '<div class="empty"><div class="ic">📊</div>No data</div>';
  return arr.map(([id,c])=>{
    const p=DB.products.find(x=>x.id===id);
    return `<div class="top-row"><div class="nm">${esc(p?p.name:id)}</div><div style="color:${color};font-weight:700;font-family:'JetBrains Mono',monospace">${c}</div></div>`;
  }).join('');
}
function renderChart(){
  const a=DB.analytics;
  const days=[];
  for(let i=6;i>=0;i--){
    const d=new Date();d.setDate(d.getDate()-i);
    const k=d.toISOString().slice(0,10);
    days.push({k,c:a.daily[k]||0});
  }
  const max=Math.max(1,...days.map(d=>d.c));
  return `<div class="chart">${days.map(d=>`<div class="bar-wrap"><div class="bar" style="height:${Math.max(2,(d.c/max)*100)}%"><span>${d.c}</span></div><div class="bar-lbl">${d.k.slice(5)}</div></div>`).join('')}</div>`;
}

async function convertOrderToJob(id){
  const o=DB.orders.find(x=>x.id===id);if(!o)return;
  const jobId='J'+String((DB.counters.job=DB.counters.job+1)).padStart(3,'0');
  DB.jobs.push({
    id:jobId,
    orderId:o.id,
    customerName:o.name,
    customerPhone:o.phone,
    name:o.productName,
    qty:o.qty,
    cost:Math.round(o.estimate*0.6),
    sell:o.estimate,
    status:'new',
    machineId:null, staffId:null,
    deadline:new Date(Date.now()+86400000*3).toISOString().slice(0,10),
    created:today(),
    notes:o.notes||''
  });
  o.status='processing';
  await persist();
  closeModal();
  toast('Job created: '+jobId);
  setTab('jobs');
}

function renderCosting(main){
  main.innerHTML=`
    <div class="mh"><div><h2>Costing Calculator</h2><div class="sub">EXACT COST + PROFIT</div></div></div>
    <div class="split">
      <div class="panel" style="margin-top:0">
        <div class="form-grid">
          <div><label>Paper GSM</label><select id="c-gsm" onchange="calcCost()"><option>70</option><option>90</option><option>130</option><option>170</option><option>250</option><option selected>300</option><option>350</option></select></div>
          <div><label>Paper ₹/sheet</label><input type="number" id="c-prate" value="6" oninput="calcCost()"></div>
          <div><label>Sheet W (in)</label><input type="number" id="c-pw" value="12" step="0.1" oninput="calcCost()"></div>
          <div><label>Sheet H (in)</label><input type="number" id="c-ph" value="18" step="0.1" oninput="calcCost()"></div>
          <div><label>Piece W (in)</label><input type="number" id="c-pcw" value="3.5" step="0.1" oninput="calcCost()"></div>
          <div><label>Piece H (in)</label><input type="number" id="c-pch" value="2" step="0.1" oninput="calcCost()"></div>
          <div><label>Quantity</label><input type="number" id="c-qty" value="500" oninput="calcCost()"></div>
          <div><label>Sides</label><select id="c-sides" onchange="calcCost()"><option value="1">Single</option><option value="2" selected>Double</option></select></div>
          <div><label>Ink ₹/piece</label><input type="number" id="c-ink" value="0.5" step="0.1" oninput="calcCost()"></div>
          <div><label>Finish ₹/piece</label><input type="number" id="c-fin" value="0.8" step="0.1" oninput="calcCost()"></div>
          <div><label>Labour ₹</label><input type="number" id="c-lab" value="150" oninput="calcCost()"></div>
          <div><label>Wastage %</label><input type="number" id="c-wast" value="5" oninput="calcCost()"></div>
          <div class="full"><label>Target Margin %</label><input type="number" id="c-margin" value="40" oninput="calcCost()"></div>
        </div>
      </div>
      <div class="calc-box">
        <div class="lbl" style="margin-bottom:6px">Suggested Sell Price</div>
        <div class="tot" id="c-sell">₹0</div>
        <div style="font-size:10.5px;color:var(--txt2);margin-top:4px;font-family:'JetBrains Mono',monospace" id="c-unit"></div>
        <div class="brk" id="c-brk"></div>
        <button class="btn btn-p" style="width:100%;justify-content:center;margin-top:14px" onclick="costToQuote()">💬 Send Quote</button>
      </div>
    </div>
  `;
  calcCost();
}
function calcCost(){
  const prate=+$('#c-prate').value||0,pw=+$('#c-pw').value||12,ph=+$('#c-ph').value||18;
  const pcw=+$('#c-pcw').value||3.5,pch=+$('#c-pch').value||2,qty=+$('#c-qty').value||1;
  const sides=+$('#c-sides').value||1,inkPP=+$('#c-ink').value||0,finPP=+$('#c-fin').value||0;
  const labour=+$('#c-lab').value||0,wast=+$('#c-wast').value||0,margin=+$('#c-margin').value||40;
  const fit1=Math.floor(pw/pcw)*Math.floor(ph/pch);
  const fit2=Math.floor(pw/pch)*Math.floor(ph/pcw);
  const pps=Math.max(fit1,fit2,1);
  const sheets=Math.ceil(qty/pps);
  const sheetsW=Math.ceil(sheets*(1+wast/100));
  const paperCost=sheetsW*prate;
  const inkCost=qty*inkPP*sides;
  const finCost=qty*finPP;
  const totalCost=paperCost+inkCost+finCost+labour;
  const sellPrice=totalCost/(1-margin/100);
  const unitPrice=sellPrice/qty;
  $('#c-sell').textContent=fmt(sellPrice);
  $('#c-unit').textContent=`${fmt(unitPrice)}/pc · ${pps} pcs/sheet · ${sheetsW} sheets`;
  $('#c-brk').innerHTML=`
    <div><span>Paper (${sheetsW} sh)</span><b>${fmt(paperCost)}</b></div>
    <div><span>Ink (${sides} side)</span><b>${fmt(inkCost)}</b></div>
    <div><span>Finish</span><b>${fmt(finCost)}</b></div>
    <div><span>Labour</span><b>${fmt(labour)}</b></div>
    <div style="color:var(--yl);padding-top:5px;border-top:1px dashed var(--line)"><span>Total Cost</span><b>${fmt(totalCost)}</b></div>
    <div style="color:var(--ok)"><span>Profit</span><b>${fmt(sellPrice-totalCost)}</b></div>`;
}
function costToQuote(){
  const sell=$('#c-sell').textContent;
  const msg=`Namaste ${DB.shop.name}! 👋\n\n*Quote*\n\nSuggested price: ${sell}\n\nPlease confirm.`;
  window.open(`https://wa.me/${DB.shop.whatsapp}?text=${encodeURIComponent(msg)}`,'_blank');
}

function renderImposition(main){
  main.innerHTML=`
    <div class="mh"><div><h2>Imposition Calculator</h2><div class="sub">PIECES PER SHEET</div></div></div>
    <div class="split">
      <div class="panel" style="margin-top:0">
        <div class="form-grid">
          <div><label>Sheet W (in)</label><input type="number" id="i-sw" value="12" step="0.1" oninput="calcImp()"></div>
          <div><label>Sheet H (in)</label><input type="number" id="i-sh" value="18" step="0.1" oninput="calcImp()"></div>
          <div><label>Piece W (in)</label><input type="number" id="i-pw" value="3.5" step="0.1" oninput="calcImp()"></div>
          <div><label>Piece H (in)</label><input type="number" id="i-ph" value="2" step="0.1" oninput="calcImp()"></div>
          <div><label>Gap (in)</label><input type="number" id="i-gap" value="0.1" step="0.05" oninput="calcImp()"></div>
          <div><label>Margin (in)</label><input type="number" id="i-margin" value="0.1" step="0.05" oninput="calcImp()"></div>
          <div class="full"><label>Quantity Needed</label><input type="number" id="i-qty" value="1000" oninput="calcImp()"></div>
        </div>
        <div class="panel" style="margin-top:14px;background:var(--bg3)">
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:12px">
            <div><span style="color:var(--txt2)">Per sheet:</span> <b id="i-pps" style="color:var(--cy);font-size:16px">—</b></div>
            <div><span style="color:var(--txt2)">Layout:</span> <b id="i-lay">—</b></div>
            <div><span style="color:var(--txt2)">Sheets:</span> <b id="i-shn">—</b></div>
            <div><span style="color:var(--txt2)">Waste 10%:</span> <b id="i-ws">—</b></div>
            <div><span style="color:var(--txt2)">Total:</span> <b id="i-tot" style="color:var(--yl);font-size:16px">—</b></div>
            <div><span style="color:var(--txt2)">Efficiency:</span> <b id="i-eff">—</b></div>
          </div>
        </div>
      </div>
      <div class="panel" style="margin-top:0">
        <label>Preview</label>
        <div class="imp-preview" id="i-prev"></div>
      </div>
    </div>
  `;
  calcImp();
}
function calcImp(){
  const sw=+$('#i-sw').value||12,sh=+$('#i-sh').value||18;
  const pw=+$('#i-pw').value||3.5,ph=+$('#i-ph').value||2;
  const gap=+$('#i-gap').value||0,margin=+$('#i-margin').value||0;
  const qty=+$('#i-qty').value||0;
  const aw=sw-margin*2,ah=sh-margin*2;
  const cw=pw+gap,ch=ph+gap;
  const lay1=Math.max(0,Math.floor((aw+gap)/cw))*Math.max(0,Math.floor((ah+gap)/ch));
  const lay2=Math.max(0,Math.floor((aw+gap)/ch))*Math.max(0,Math.floor((ah+gap)/cw));
  const pps=Math.max(lay1,lay2,0);
  const rotated=lay2>lay1;
  const cols=rotated?Math.floor((aw+gap)/ch):Math.floor((aw+gap)/cw);
  const rows=rotated?Math.floor((ah+gap)/cw):Math.floor((ah+gap)/ch);
  const sheets=pps>0?Math.ceil(qty/pps):0;
  const waste=Math.ceil(sheets*0.10);
  const total=sheets+waste;
  const eff=pps>0?((pps*pw*ph)/(sw*sh)*100).toFixed(1):0;
  $('#i-pps').textContent=pps;
  $('#i-lay').textContent=pps?`${cols} × ${rows}${rotated?' (rotated)':''}`:'—';
  $('#i-shn').textContent=sheets;
  $('#i-ws').textContent=waste;
  $('#i-tot').textContent=total;
  $('#i-eff').textContent=eff+'%';
  if(pps>0){
    const sheetW=280,sheetH=sheetW*(sh/sw);
    $('#i-prev').innerHTML=`<div class="imp-sheet" style="width:${sheetW}px;height:${sheetH}px;padding:${(margin/sw)*sheetW}px;grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr);gap:${(gap/sw)*sheetW}px">${Array(pps).fill(0).map(()=>`<div class="imp-piece"></div>`).join('')}</div>`;
  }else{
    $('#i-prev').innerHTML='<div class="empty">Not fit</div>';
  }
}

  $('#iv-items').appendChild(div);
  ['iv-d','iv-q','iv-r'].forEach(c=>div.querySelector('.'+c).addEventListener('input',updateInvSum));
  updateInvSum();
}
function getInvItems(){
  return $$('#iv-items .row').map(r=>({desc:r.querySelector('.iv-d').value,qty:+r.querySelector('.iv-q').value||0,rate:+r.querySelector('.iv-r').value||0})).filter(i=>i.qty>0||i.rate>0);
}
function updateInvSum(){
  const items=getInvItems();
  const sub=items.reduce((s,i)=>s+i.qty*i.rate,0);
  const tax=+$('#iv-tax').value||0;
  const taxAmt=sub*tax/100;
  const total=sub+taxAmt;
  const paid=+$('#iv-paid').value||0;
  const due=total-paid;
  $('#iv-sum').innerHTML=`Sub: <b>${fmt(sub)}</b> · GST: <b>${fmt(taxAmt)}</b> · <span style="color:var(--cy)">Total: <b>${fmt(total)}</b></span> · Due: <span style="color:${due>0?'var(--er)':'var(--ok)'}"><b>${fmt(due)}</b></span>`;
}
async function saveInvoice(id){
  const items=getInvItems();
  if(!items.length){toast('Add items','err');return;}
  const sub=items.reduce((s,i)=>s+i.qty*i.rate,0);
  const taxPct=+$('#iv-tax').value||0;
  const total=sub+(sub*taxPct/100);
  const paid=+$('#iv-paid').value||0;
  const status=paid>=total?'paid':paid>0?'partial':'unpaid';
  const data={id:$('#iv-num').value,customerName:$('#iv-cust').value.trim(),date:$('#iv-date').value,items,tax:taxPct,subtotal:sub,total,paid,status,notes:$('#iv-notes').value};
  if(id){Object.assign(DB.invoices.find(i=>i.id===id),data);}
  else{DB.counters.inv++;DB.invoices.push(data);}
  await persist();closeModal();renderTab();toast('Saved');
}

async function enableSync(){
  if(!confirm('Generate new sync code? Current data upload hoga.'))return;
  try{
    // 1. Create bucket
    const res=await fetch('https://kvdb.io/',{method:'POST'});
    if(!res.ok)throw new Error('Bucket creation failed');
    const bucketId=(await res.text()).trim();
    
    // 2. Upload initial data
    const saveRes=await fetch(`https://kvdb.io/${bucketId}/shop_data`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(DB)
    });
    if(!saveRes.ok)throw new Error('Data upload failed');

    localStorage.setItem('lc_sync',bucketId);
    toast('Sync enabled! Reloading...');
    setTimeout(()=>location.href='admin.html?sync='+bucketId,1200);
  }catch(e){toast('Error: '+e.message,'err');}
}

/* ===== MODAL ===== */
function closeModal(){$('#modal').classList.remove('open');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ===== INIT ===== */
async function init(){
  localLoad();
  if(SYNC){const ok=await cloudLoad();if(!ok)storageMode='local';}
  if(isAuthed())showApp();
  else $('#pinIn').focus();
}
init();
</script>
</body>
